<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ลิงก์ในอีเมลมี token อยู่ใน URL — ห้ามส่ง URL นี้ต่อไปยังเว็บอื่นผ่าน Referer -->
    <meta name="referrer" content="no-referrer">
    <title>ตั้งรหัสผ่านใหม่ | KPOP STORE</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ชั้น responsive ที่ใช้ร่วมกันทุกหน้า — ต้องอยู่หลัง bootstrap เพื่อ override ได้ -->
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/common.css">
    <!-- หน้าตาเดียวกับหน้าเข้าสู่ระบบ -->
    <link rel="stylesheet" href="css/pages/login.css">
</head>
<body>

    <nav class="navbar navbar-expand-md sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fa-solid fa-heart me-2" style="color: #ff3399; font-size: 1.5rem;"></i>
                KPOP STORE
            </a>
            <div class="d-flex align-items-center"></div>
        </div>
    </nav>

    <div class="container">
        <div class="login-container">
            <div class="login-card">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-key d-block mb-2" style="color: #ff3399; font-size: 2rem;"></i>
                    <h3 style="font-weight: 600;">ตั้งรหัสผ่านใหม่</h3>
                    <p class="text-muted mb-0" id="resetSubtitle">กำลังตรวจสอบลิงก์...</p>
                </div>

                <form id="resetPasswordForm" class="d-none" onsubmit="handleResetSubmit(event)">
                    <div class="mb-3">
                        <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label>
                        <input type="password" id="resetNew" class="form-control" minlength="6" autocomplete="new-password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">ยืนยันรหัสผ่านใหม่</label>
                        <input type="password" id="resetConfirm" class="form-control" minlength="6" autocomplete="new-password" required>
                    </div>
                    <button type="submit" id="resetSubmitBtn" class="btn btn-dark-custom w-100 py-2" style="font-size: 1rem;">
                        <i class="fa-solid fa-floppy-disk me-2"></i>บันทึกรหัสผ่านใหม่
                    </button>
                </form>

                <div id="resetInvalid" class="d-none text-center">
                    <p class="text-danger" id="resetInvalidText"></p>
                    <a href="login.html" class="btn btn-dark-custom px-4 text-decoration-none">ไปหน้าเข้าสู่ระบบเพื่อขอลิงก์ใหม่</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/reset-password.js"></script>

</body>
</html>
