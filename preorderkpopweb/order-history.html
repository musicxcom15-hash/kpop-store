<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติคำสั่งซื้อ | KPOP STORE</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ชั้น responsive ที่ใช้ร่วมกันทุกหน้า — ต้องอยู่หลัง bootstrap เพื่อ override ได้ -->
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/pages/order-history.css">
</head>
<body>

    <nav class="navbar navbar-expand-md sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fa-solid fa-heart me-2" style="color: #ff3399; font-size: 1.5rem;"></i> KPOP STORE
            </a>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link px-3" href="index.html">หน้าแรก</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="javascript:void(0)" onclick="KpopStore.goToAllProducts()"><i class="fa-solid fa-boxes-stacked me-1 text-danger"></i>สินค้าทั้งหมด</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="javascript:void(0)" onclick="KpopStore.openHowToOrderModal()"><i class="fa-solid fa-circle-question me-1 text-primary"></i>วิธีการสั่งซื้อ</a></li>
                    <li class="nav-item"><a class="nav-link px-3 active" href="order-history.html">ประวัติคำสั่งซื้อ</a></li>
                </ul>
            </div>
            <div class="d-flex align-items-center">
                <span class="me-3 text-muted" style="font-size: 0.9rem;">
                    <i class="fa-regular fa-circle-user me-2"></i>คุณลูกค้า
                </span>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white" id="customerProfileCard">
            <!-- Dynamic User Profile Info -->
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div>
                <h3 style="font-weight: 600;" class="mb-1">ประวัติคำสั่งซื้อของฉัน</h3>
                <p class="text-muted m-0" style="font-size: 0.9rem;">ติดตามสถานะพัสดุ ตรวจสอบการโอนเงิน และดูประวัติการสั่งซื้อพรีออเดอร์</p>
            </div>
            <button class="btn btn-outline-dark rounded-pill px-3 btn-sm" onclick="refreshOrderHistoryPage()"><i class="fa-solid fa-rotate me-1"></i> รีเฟรชสถานะ</button>
        </div>

        <!-- Order Filter Tabs -->
        <ul class="nav nav-pills mb-4 border-bottom pb-2 gap-1" id="orderFilterTabs">
            <li class="nav-item">
                <button class="nav-link active rounded-pill btn-sm px-3 fw-bold" onclick="setOrderFilter('all', this)"><i class="fa-solid fa-list me-1"></i> คำสั่งซื้อทั้งหมด</button>
            </li>
            <li class="nav-item">
                <button class="nav-link rounded-pill btn-sm px-3 fw-bold" onclick="setOrderFilter('pending', this)"><i class="fa-solid fa-hourglass-half me-1"></i> รอตรวจสอบ</button>
            </li>
            <li class="nav-item">
                <button class="nav-link rounded-pill btn-sm px-3 fw-bold" onclick="setOrderFilter('processing', this)"><i class="fa-solid fa-box-open me-1"></i> กำลังเตรียมจัดส่ง</button>
            </li>
            <li class="nav-item">
                <button class="nav-link rounded-pill btn-sm px-3 fw-bold" onclick="setOrderFilter('shipped', this)"><i class="fa-solid fa-truck-fast me-1"></i> จัดส่งแล้ว</button>
            </li>
            <li class="nav-item">
                <button class="nav-link rounded-pill btn-sm px-3 fw-bold text-danger" onclick="setOrderFilter('cancelled', this)"><i class="fa-solid fa-ban me-1"></i> ยกเลิกแล้ว</button>
            </li>
            <li class="nav-item">
                <button class="nav-link rounded-pill btn-sm px-3 fw-bold text-warning" onclick="setOrderFilter('refund', this)"><i class="fa-solid fa-rotate-left me-1"></i> คืนเงิน</button>
            </li>
        </ul>

        <div class="row">
            <div class="col-12" id="customerOrdersContainer">
                <!-- Dynamic JS Orders -->
            </div>
        </div>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal fade" id="customerOrderDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 18px;">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold" id="detailModalTitle"><i class="fa-solid fa-receipt me-2 text-primary"></i>รายละเอียดคำสั่งซื้อ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="detailModalBody">
                    <!-- Dynamic Body -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/order-history.js"></script>
</body>
</html>
