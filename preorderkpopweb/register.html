<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | KPOP STORE</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #fcfcfc;
        }
        
        /* Navbar */
        .navbar { background-color: #ffffff; box-shadow: 0 2px 15px rgba(0,0,0,0.03); padding: 15px 0; }
        .navbar-brand { font-weight: 600; font-size: 1.2rem; color: #333 !important; letter-spacing: 1px; }
        
        /* สไตล์กล่อง Register */
        .register-container {
            max-width: 500px;
            margin: 50px auto;
        }
        .register-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 40px;
            background-color: white;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #ff3399;
            box-shadow: 0 0 0 0.2rem rgba(255, 51, 153, 0.15);
        }
        .nav-link { color: #555 !important; font-weight: 400; font-size: 0.95rem; }
        .nav-link:hover, .nav-link.active { color: #ff3399 !important; font-weight: 500; }
        
        .btn-dark-custom {
            background-color: #1a1a24; color: #ffffff !important; border-radius: 50rem;
            padding: 6px 18px; font-size: 0.88rem; border: 1px solid #1a1a24; font-weight: 500;
            box-shadow: 0 2px 8px rgba(26, 26, 36, 0.12);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-dark-custom:hover, .btn-dark-custom.active {
            background-color: #ff3399; border-color: #ff3399; color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(255, 51, 153, 0.35); transform: translateY(-1px);
        }
        .btn-dark-custom:active { transform: translateY(0); }

        .btn-outline-dark-custom {
            border: 1.5px solid #1a1a24; color: #1a1a24 !important; border-radius: 50rem;
            padding: 6px 18px; font-size: 0.88rem; font-weight: 500;
            background-color: transparent;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-outline-dark-custom:hover {
            background-color: #1a1a24; border-color: #1a1a24; color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(26, 26, 36, 0.15); transform: translateY(-1px);
        }
        .btn-outline-dark-custom:active { transform: translateY(0); }

        .cart-badge {
            position: absolute; top: -5px; right: -8px; background-color: #ff3399;
            color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- expand-md ให้ตรงกับแถบล่างมือถือที่ซ่อนตัวเองที่ >=768px (d-md-none) -->
    <nav class="navbar navbar-expand-md sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fa-solid fa-heart me-2" style="color: #ff3399; font-size: 1.5rem;"></i>
                KPOP STORE
            </a>
            
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link px-3" href="index.html">หน้าแรก</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="index.html#products">สินค้าทั้งหมด</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="index.html#preorder">พรีออเดอร์</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="order-history.html">ติดตามพัสดุ</a></li>
                </ul>
            </div>

            <div class="d-flex align-items-center">
                <a href="order-history.html" class="text-dark me-4 position-relative text-decoration-none" title="ประวัติคำสั่งซื้อของฉัน">
                    <i class="fa-solid fa-receipt fs-5 text-secondary"></i>
                    <span class="cart-badge">0</span>
                </a>

                <a href="register.html" class="btn btn-dark-custom me-2 text-decoration-none">
                    <i class="fa-solid fa-user-plus me-1" style="font-size: 0.8rem;"></i> สมัครสมาชิก
                </a>
                <a href="login.html" class="btn btn-outline-dark-custom text-decoration-none">
                    <i class="fa-solid fa-right-to-bracket me-1" style="font-size: 0.85rem;"></i> เข้าสู่ระบบ
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="register-container">
            <div class="register-card">
                <div class="text-center mb-4">
                    <h3 style="font-weight: 600;">สร้างบัญชีใหม่</h3>
                    <p class="text-muted">สมัครสมาชิกเพื่อสั่งพรีออเดอร์สินค้าได้ทันที</p>
                </div>
                
                <form onsubmit="handleRegister(event)">
                    <div class="mb-3">
                        <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">ชื่อ - นามสกุล</label>
                        <input type="text" id="regName" class="form-control" placeholder="ระบุชื่อและนามสกุลของคุณ" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">อีเมล</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">เบอร์โทรศัพท์</label>
                        <input type="tel" id="regPhone" class="form-control" placeholder="08X-XXX-XXXX" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">ที่อยู่สำหรับจัดส่งสินค้า</label>
                        <textarea id="regAddress" class="form-control" rows="3" placeholder="บ้านเลขที่, หมู่บ้าน, ซอย, ถนน, ตำบล/แขวง, อำเภอ/เขต, จังหวัด, รหัสไปรษณีย์" required></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">รหัสผ่าน</label>
                            <input type="password" id="regPassword" class="form-control" placeholder="ตั้งรหัสผ่าน" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">ยืนยันรหัสผ่าน</label>
                            <input type="password" id="regConfirmPassword" class="form-control" placeholder="กรอกอีกครั้ง" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-dark-custom w-100 py-2 mb-4" style="font-size: 1rem;"><i class="fa-solid fa-user-plus me-2"></i>ยืนยันสมัครสมาชิก</button>
                    
                    <div class="text-center" style="font-size: 0.9rem;">
                        <span class="text-muted">มีบัญชีผู้ใช้งานอยู่แล้ว?</span> 
                        <a href="login.html" class="text-decoration-none" style="color: #ff3399; font-weight: 500;">เข้าสู่ระบบ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const pass = document.getElementById('regPassword').value;
            const confirmPass = document.getElementById('regConfirmPassword').value;

            if (pass !== confirmPass) {
                alert('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
                return;
            }
            if (pass.length < 6) {
                alert('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษรค่ะ');
                return;
            }

            // สมัครสมาชิกเป็นคำสั่งเดียวที่ฝั่งเซิร์ฟเวอร์: สร้างบัญชี + เก็บรหัสผ่านแบบ hash
            // + เปิด session ให้ในคราวเดียว
            //
            // การตรวจอีเมลซ้ำอยู่ที่ฐานข้อมูล (UNIQUE) ไม่ใช่ที่นี่ เพราะผู้ใช้ที่ยังไม่ล็อกอิน
            // มองไม่เห็นรายชื่อบัญชีคนอื่นอยู่แล้ว และการเช็คฝั่งเบราว์เซอร์กันคนสมัคร
            // พร้อมกันสองคนไม่ได้
            const res = await KpopStore.register({
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value,
                address: document.getElementById('regAddress').value
            }, pass);

            const next = KpopStore.getSafeNextUrl();

            if (!res.success) {
                alert('สมัครสมาชิกไม่สำเร็จค่ะ\n\n' + res.message);
                // อีเมลถูกใช้แล้ว = ผู้ใช้น่าจะมีบัญชีอยู่ พาไปหน้าล็อกอินพร้อมปลายทางเดิม
                if (res.message && res.message.indexOf('มีบัญชีอยู่ในระบบแล้ว') !== -1) {
                    window.location.href = next
                        ? 'login.html?next=' + encodeURIComponent(next)
                        : 'login.html';
                }
                return;
            }

            // มาจากปุ่มสั่งซื้อ/เพิ่มลงตะกร้าที่ค้างไว้ ก็พากลับไปที่สินค้าตัวเดิม
            alert('สมัครสมาชิกเรียบร้อยแล้วค่ะ!');
            window.location.href = next || 'index.html';
        }
    </script>

</body>
</html>
