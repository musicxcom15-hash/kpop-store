<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | KPOP STORE</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ชั้น responsive ที่ใช้ร่วมกันทุกหน้า — ต้องอยู่หลัง bootstrap เพื่อ override ได้ -->
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/pages/register.css">
</head>
<body>

    <!-- expand-md ให้ตรงกับแถบล่างมือถือที่ซ่อนตัวเองที่ >=768px (d-md-none) -->
    <nav class="navbar navbar-expand-md sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fa-solid fa-heart me-2" style="color: #ff3399; font-size: 1.5rem;"></i>
                KPOP STORE
            </a>
            
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link px-3" href="index.html">หน้าแรก</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="index.html#products">สินค้าทั้งหมด</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="index.html#preorder">พรีออเดอร์</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="order-history.html">ติดตามพัสดุ</a></li>
                </ul>
            </div>

            <div class="d-flex align-items-center">
                <a href="order-history.html" class="text-dark me-4 position-relative text-decoration-none" title="ประวัติคำสั่งซื้อของฉัน">
                    <i class="fa-solid fa-receipt fs-5 text-secondary"></i>
                    <span class="cart-badge">0</span>
                </a>

                <a href="register.html" class="btn btn-dark-custom me-2 text-decoration-none">
                    <i class="fa-solid fa-user-plus me-1" style="font-size: 0.8rem;"></i> สมัครสมาชิก
                </a>
                <a href="login.html" class="btn btn-outline-dark-custom text-decoration-none">
                    <i class="fa-solid fa-right-to-bracket me-1" style="font-size: 0.85rem;"></i> เข้าสู่ระบบ
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="register-container">
            <div class="register-card">
                <div class="text-center mb-4">
                    <h3 style="font-weight: 600;">สร้างบัญชีใหม่</h3>
                    <p class="text-muted">สมัครสมาชิกเพื่อสั่งพรีออเดอร์สินค้าได้ทันที</p>
                </div>
                
                <form onsubmit="handleRegister(event)">
                    <div class="mb-3">
                        <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">ชื่อ - นามสกุล</label>
                        <input type="text" id="regName" class="form-control" placeholder="ระบุชื่อและนามสกุลของคุณ" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">อีเมล</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">เบอร์โทรศัพท์</label>
                        <input type="tel" id="regPhone" class="form-control" placeholder="08X-XXX-XXXX" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">ที่อยู่สำหรับจัดส่งสินค้า</label>
                        <textarea id="regAddress" class="form-control" rows="3" placeholder="บ้านเลขที่, หมู่บ้าน, ซอย, ถนน, ตำบล/แขวง, อำเภอ/เขต, จังหวัด, รหัสไปรษณีย์" required></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">รหัสผ่าน</label>
                            <input type="password" id="regPassword" class="form-control" placeholder="ตั้งรหัสผ่าน" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">ยืนยันรหัสผ่าน</label>
                            <input type="password" id="regConfirmPassword" class="form-control" placeholder="กรอกอีกครั้ง" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-dark-custom w-100 py-2 mb-4" style="font-size: 1rem;"><i class="fa-solid fa-user-plus me-2"></i>ยืนยันสมัครสมาชิก</button>
                    
                    <div class="text-center" style="font-size: 0.9rem;">
                        <span class="text-muted">มีบัญชีผู้ใช้งานอยู่แล้ว?</span> 
                        <a href="login.html" class="text-decoration-none" style="color: #ff3399; font-weight: 500;">เข้าสู่ระบบ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/register.js"></script>

</body>
</html>
