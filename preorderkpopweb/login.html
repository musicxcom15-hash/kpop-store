<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | KPOP STORE</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ชั้น responsive ที่ใช้ร่วมกันทุกหน้า — ต้องอยู่หลัง bootstrap เพื่อ override ได้ -->
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/pages/login.css">
</head>
<body>

    <!-- expand-md ให้ตรงกับแถบล่างมือถือที่ซ่อนตัวเองที่ >=768px (d-md-none) -->
    <nav class="navbar navbar-expand-md sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fa-solid fa-heart me-2" style="color: #ff3399; font-size: 1.5rem;"></i>
                KPOP STORE
            </a>
            
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link px-3" href="index.html">หน้าแรก</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="index.html#products">สินค้าทั้งหมด</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="index.html#preorder">พรีออเดอร์</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="order-history.html">ติดตามพัสดุ</a></li>
                </ul>
            </div>

            <div class="d-flex align-items-center">
                <a href="order-history.html" class="text-dark me-4 position-relative text-decoration-none" title="ประวัติคำสั่งซื้อของฉัน">
                    <i class="fa-solid fa-receipt fs-5 text-secondary"></i>
                    <span class="cart-badge">0</span>
                </a>

                <a href="register.html" class="btn btn-outline-dark-custom me-2 text-decoration-none">
                    <i class="fa-solid fa-user-plus me-1" style="font-size: 0.8rem;"></i> สมัครสมาชิก
                </a>
                <a href="login.html" class="btn btn-dark-custom text-decoration-none">
                    <i class="fa-solid fa-right-to-bracket me-1" style="font-size: 0.85rem;"></i> เข้าสู่ระบบ
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="login-container">
            <div class="login-card">
                <div class="text-center mb-4">
                    <h3 style="font-weight: 600;">ยินดีต้อนรับกลับมา!</h3>
                    <p class="text-muted">เข้าสู่ระบบเพื่อติดตามพรีออเดอร์ศิลปินคนโปรดของคุณ</p>
                </div>
                
                <form onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">อีเมล</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" autocomplete="email" required>
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label class="form-label" style="font-size: 0.9rem; font-weight: 500;">รหัสผ่าน</label>
                            <a href="#" class="text-decoration-none" style="font-size: 0.85rem; color: #ff3399;">ลืมรหัสผ่าน?</a>
                        </div>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-dark-custom w-100 py-2 mb-3" style="font-size: 1rem;"><i class="fa-solid fa-right-to-bracket me-2"></i>เข้าสู่ระบบ</button>

                    <div class="text-center" style="font-size: 0.9rem;">
                        <span class="text-muted">ยังไม่มีบัญชีใช่ไหม?</span> 
                        <a href="register.html" id="goRegisterLink" class="text-decoration-none" style="color: #ff3399; font-weight: 500;">สมัครสมาชิกเลย</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/login.js"></script>

</body>
</html>
